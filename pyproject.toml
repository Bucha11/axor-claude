[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "axor-claude"
version = "0.4.0"
description = "Claude Code adapter for axor-core governance kernel"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["claude", "anthropic", "agents", "governance", "axor", "claude-code"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Floor raised 0.8 -> 0.9 together with the ceiling: `IntentNormalizer` moved
    # from `axor_core.node.normalizer` to `axor_core.policy.normalizer` in core
    # 0.9.0, and `axor_claude.normalizer` now imports it from there. The old
    # `axor_core.node.normalizer` resolved fine on 0.8.x, so the previous pin was
    # self-consistent — it is THIS change that needs 0.9 as the floor: the new
    # import does not exist before it. Raising the ceiling required the migration.
    # Measured against an installed 0.12.0: 117 tests pass.
    "axor-core>=0.9,<0.13",
    "anthropic>=0.40.0,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]
security = ["axor-probe", "axor-sentinel"]

[project.urls]
Repository = "https://github.com/Bucha11/axor-claude"
"Bug Tracker" = "https://github.com/Bucha11/axor-claude/issues"

[tool.hatch.build.targets.wheel]
packages = ["axor_claude"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Integration tests make real, billable API calls and require ANTHROPIC_API_KEY.
# They are opt-in: run them explicitly with `pytest -m integration`.
addopts = "-m 'not integration'"
markers = [
    "integration: requires ANTHROPIC_API_KEY",
]

[tool.coverage.run]
source = ["axor_claude"]
omit = ["tests/*"]
