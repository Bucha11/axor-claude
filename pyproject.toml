[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "axor-claude"
version = "0.3.1"
description = "Claude Code adapter for axor-core governance kernel"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["claude", "anthropic", "agents", "governance", "axor", "claude-code"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "axor-core>=0.6.0,<0.7",
    "anthropic>=0.40.0,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]
security = ["axor-probe", "axor-sentinel"]

[project.urls]
Repository = "https://github.com/Bucha11/axor-claude"
"Bug Tracker" = "https://github.com/Bucha11/axor-claude/issues"

[tool.hatch.build.targets.wheel]
packages = ["axor_claude"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires ANTHROPIC_API_KEY",
]

[tool.coverage.run]
source = ["axor_claude"]
omit = ["tests/*"]
